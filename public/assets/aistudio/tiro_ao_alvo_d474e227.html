<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaGame | Tiro ao Alvo</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff0055;
            --bg-dark: #050a14;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            cursor: crosshair;
        }

        .btn-voltar { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: #000; 
            color: var(--neon-blue); 
            border: 2px solid var(--neon-blue); 
            padding: 12px 25px; 
            border-radius: 8px; 
            cursor: pointer; 
            text-decoration: none; 
            font-size: 16px; 
            z-index: 200;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-voltar:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        #game-container {
            position: relative;
            width: 90vw;
            height: 75vh;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.3);
            background: radial-gradient(circle, #0a1628 0%, #050a14 100%);
            overflow: hidden;
        }

        #grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.1) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.1) 2px, transparent 2px);
            background-size: 60px 60px;
            transform: perspective(500px) rotateX(60deg);
            z-index: 0;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            gap: 25px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .stat-box {
            background: rgba(0, 242, 255, 0.1);
            padding: 15px 25px;
            border-left: 5px solid var(--neon-blue);
            font-size: 20px;
            font-weight: bold;
        }

        .target {
            position: absolute;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cube {
            width: 70px;
            height: 70px;
            border: 3px solid var(--neon-red);
            box-shadow: inset 0 0 15px var(--neon-red), 0 0 20px var(--neon-red);
            animation: rotate 3s linear infinite;
        }

        .tower {
            width: 45px;
            height: 100px;
            border: 3px solid var(--neon-blue);
            box-shadow: inset 0 0 15px var(--neon-blue), 0 0 20px var(--neon-blue);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #crosshair {
            position: fixed;
            width: 50px;
            height: 50px;
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        #crosshair::before { content: ''; position: absolute; width: 100%; height: 2px; top: 50%; left: 0; background: var(--neon-blue); }
        #crosshair::after { content: ''; position: absolute; height: 100%; width: 2px; left: 50%; top: 0; background: var(--neon-blue); }

        #start-screen {
            position: absolute;
            inset: 0;
            background: rgba(5, 10, 20, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }

        button.start-btn {
            background: transparent;
            color: var(--neon-blue);
            border: 3px solid var(--neon-blue);
            padding: 25px 60px;
            font-size: 32px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
        }

        button.start-btn:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 40px var(--neon-blue);
        }

        .message {
            margin-top: 30px;
            color: var(--neon-red);
            font-weight: bold;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-voltar">← VOLTAR AO MENU</a>

    <div id="crosshair"></div>

    <div id="game-container">
        <div id="grid"></div>
        <div id="ui-overlay">
            <div class="stat-box">PONTOS: <span id="score">000</span></div>
            <div class="stat-box">TEMPO: <span id="time">30</span>s</div>
        </div>
        <div id="start-screen">
            <h1 id="title" style="color: var(--neon-blue); margin-bottom: 40px; font-size: 50px;">TIRO AO ALVO</h1>
            <button class="start-btn" onclick="startGame()">INICIAR</button>
            <div class="message" id="game-msg"></div>
        </div>
        <div id="targets-layer"></div>
    </div>

    <script>
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const targetsLayer = document.getElementById('targets-layer');
        const startScreen = document.getElementById('start-screen');
        const crosshair = document.getElementById('crosshair');
        const msgEl = document.getElementById('game-msg');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let spawnInterval;

        document.addEventListener('mousemove', (e) => {
            crosshair.style.left = e.clientX + 'px';
            crosshair.style.top = e.clientY + 'px';
        });

        function createTarget() {
            if (!gameActive) return;
            const target = document.createElement('div');
            const type = Math.random() > 0.5 ? 'cube' : 'tower';
            target.className = `target ${type}`;
            const container = document.getElementById('game-container').getBoundingClientRect();
            target.style.left = `${Math.random() * (container.width - 120) + 60}px`;
            target.style.top = `${Math.random() * (container.height - 180) + 60}px`;
            target.onclick = (e) => {
                e.stopPropagation();
                if (!gameActive) return;
                score += (type === 'cube' ? 15 : 10);
                scoreEl.innerText = score.toString().padStart(3, '0');
                target.remove();
            };
            targetsLayer.appendChild(target);
            setTimeout(() => { if (target.parentNode) target.remove(); }, 1400);
        }

        function startGame() {
            score = 0; timeLeft = 30; gameActive = true;
            scoreEl.innerText = "000";
            startScreen.style.display = 'none';
            msgEl.innerText = "";
            targetsLayer.innerHTML = "";
            spawnInterval = setInterval(createTarget, 650);
            const timer = setInterval(() => {
                timeLeft--;
                timeEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    clearInterval(spawnInterval);
                    gameActive = false;
                    startScreen.style.display = 'flex';
                    document.getElementById('title').innerText = "FIM DE JOGO";
                    msgEl.innerText = `PONTUAÇÃO FINAL: ${score}`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
